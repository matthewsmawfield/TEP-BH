    <meta name="description" content="The Temporal Equivalence Principle (TEP) distinguishes the Einstein-frame gravitational metric from the universal causal matter metric. The TEP black-hole interpretation is dual to the TEP cosmological interpretation: cosmological expansion and black-hole collapse are dual misinterpretations of dynamical proper time. A black hole is a temporal well — a regular spatial region with an extreme gradient in relative proper-time accumulation. The physical lapse N(r) >= N_min > 0 everywhere, with a finite but extremely small minimum at the centre. The temporal field changes observed motion through clock transfer, timelike matter coupling, and its backreaction on the causal geometry. Darkness does not require an event horizon; it requires sufficiently extreme temporal decoupling. Apparent compactness != physical compression. The mass conventionally assigned to a black-hole candidate is itself an inference artefact: M_app^GR = M_local^TEP + M_phantom^T, the strong-field counterpart of Phantom Mass at galactic scales. The fixed-background theorem proves that a dynamical proper-time field necessarily backreacts on gravity. The coupled Einstein-scalar-Gauss-Bonnet exterior yields a coupling-order difference: shadow -0.044%, ISCO on tilde g +1.95% at eta=-0.1, conditional on the GR-calibrated mass scale. The tensor speed c_T = 1 on the Schwarzschild background. A horizonless temporal well replaces the purely ingoing horizon condition with a theory-dependent regular inner condition — the late-time response may contain echoes, additional damping, or new coupled modes.">
